[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-desktop"
version = "1.0.0"
description = "Cross-platform desktop point of sale with double-entry accounting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pos-desktop = "pos_desktop.app:main"

[tool.setuptools.packages.find]
include = ["pos_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pos_desktop = ["resources/*"]
